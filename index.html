<!DOCTYPE html>
<html>
<head>
    <title>Stock Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            border: 1px solid #e5e5e5;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }
        
        h2 {
            grid-column: 1 / -1;
            text-align: center;
            color: #333;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e5e5e5;
        }
        
        .input-box, .results-box {
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #e5e5e5;
        }
        
        .input-box {
            background: #fff;
        }
        
        .results-box {
            background: #f8f9fa;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #666;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            font-size: 18px;
            background: #fff;
            color: #333;
            transition: border-color 0.2s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #4285f4;
            box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.1);
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #e5e5e5;
            font-size: 15px;
        }
        
        .result-item:last-child {
            border-bottom: none;
        }
        
        .result-label {
            color: #666;
            font-weight: 500;
        }
        
        .result-value {
            font-size: 22px;
            font-weight: 700;
            font-family: 'SF Mono', Monaco, monospace;
            color: #333;
            min-width: 120px;
            text-align: right;
        }
        
        .profit { color: #00c851 !important; }
        .loss { color: #d93025 !important; }
        
        .overall {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            border: 2px solid #2196f3;
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(33, 150, 243, 0.15);
        }
        
        .overall-title {
            font-size: 16px;
            color: #1976d2;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .overall-value {
            font-size: 28px;
            font-weight: 800;
            color: #1565c0;
        }
        
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 24px;
                max-width: 500px;
                padding: 32px 24px;
            }
            
            h2 {
                font-size: 24px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                margin: 10px;
                padding: 24px 20px;
            }
            
            .input-group {
                margin-bottom: 16px;
            }
            
            input {
                padding: 14px 16px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Stock Calculator</h2>
        
        <div class="input-box">
            <div class="input-group">
                <label>Buy Price (₹)</label>
                <input type="number" id="buyPrice" value="50" step="0.01">
            </div>
            <div class="input-group">
                <label>Quantity</label>
                <input type="number" id="quantity" value="50">
            </div>
            <div class="input-group">
                <label>Current Price (₹)</label>
                <input type="number" id="currentPrice" value="100" step="0.01">
            </div>
        </div>
        
        <div class="results-box">
            <div class="result-item">
                <span class="result-label">Total Invested</span>
                <span id="invested" class="result-value">₹2,500</span>
            </div>
            <div class="result-item">
                <span class="result-label">Profit/Loss</span>
                <span id="profit" class="result-value profit">₹+2,500</span>
            </div>
            <div class="result-item">
                <span class="result-label">Profit %</span>
                <span id="profitPct" class="result-value profit">+100%</span>
            </div>
            <div id="overall" class="overall">
                <div class="overall-title">Overall Amount</div>
                <div id="overallAmt" class="overall-value">₹5,000</div>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const buyPrice = parseFloat(document.getElementById('buyPrice').value) || 0;
            const quantity = parseInt(document.getElementById('quantity').value) || 0;
            const currentPrice = parseFloat(document.getElementById('currentPrice').value) || 0;
            
            const invested = (buyPrice * quantity);
            const profitAmt = (currentPrice - buyPrice) * quantity;
            const profitPercent = buyPrice > 0 ? ((currentPrice - buyPrice) / buyPrice * 100).toFixed(2) : '0.00';
            const overallAmount = invested + profitAmt; // Total Invested + Profit/Loss
            
            // Format numbers
            document.getElementById('invested').textContent = `₹${invested.toLocaleString('en-IN')}`;
            
            const profitEl = document.getElementById('profit');
            profitEl.innerHTML = `₹${profitAmt >= 0 ? '+' : ''}${Math.abs(profitAmt).toLocaleString('en-IN')}`;
            profitEl.className = `result-value ${profitAmt >= 0 ? 'profit' : 'loss'}`;
            
            const pctEl = document.getElementById('profitPct');
            pctEl.innerHTML = `${profitAmt >= 0 ? '+' : ''}${profitPercent}%`;
            pctEl.className = `result-value ${profitAmt >= 0 ? 'profit' : 'loss'}`;
            
            document.getElementById('overallAmt').textContent = `₹${overallAmount.toLocaleString('en-IN')}`;
        }
        
        ['buyPrice', 'quantity', 'currentPrice'].forEach(id => {
            document.getElementById(id).addEventListener('input', calculate);
        });
        calculate();
    </script>
</body>
</html>
