<!DOCTYPE html>
<html>
<head>
    <title>Stock Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e5e5e5;
        }
        
        h2 {
            text-align: center;
            color: #333;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e5e5e5;
        }
        
        .input-group {
            margin-bottom: 24px;
            position: relative;
        }
        
        label {
            display: block;
            color: #666;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            font-size: 16px;
            background: #fff;
            color: #333;
            transition: all 0.2s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #4285f4;
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        }
        
        .results-card {
            background: #f8f9fa;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 24px;
            margin-top: 24px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            color: #666;
            font-weight: 500;
            font-size: 14px;
            padding: 12px 0;
            text-align: left;
        }
        
        td {
            padding: 16px 0;
            font-size: 22px;
            font-weight: 700;
            font-family: 'SF Mono', Monaco, monospace;
            color: #333;
        }
        
        .profit {
            color: #00c851 !important;
            background: #e8f5e8;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 8px;
        }
        
        .loss {
            color: #d93025 !important;
            background: #fce8e6;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 8px;
        }
        
        .overall {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
            text-align: center;
        }
        
        .overall strong {
            font-size: 24px;
            color: #1976d2;
            font-weight: 700;
        }
        
        .checkbox-group {
            margin: 24px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
        
        @media (max-width: 480px) {
            .container {
                margin: 10px;
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Stock Calculator</h2>
        
        <div class="input-group">
            <label>Buy Price (₹)</label>
            <input type="number" id="buyPrice" value="50" step="0.01">
        </div>
        
        <div class="input-group">
            <label>Quantity</label>
            <input type="number" id="quantity" value="50">
        </div>
        
        <div class="input-group">
            <label>Current Price (₹)</label>
            <input type="number" id="currentPrice" value="100" step="0.01">
        </div>
        
        <div class="results-card">
            <table>
                <tr>
                    <th>Total Invested</th>
                    <td id="invested">₹2,500</td>
                </tr>
                <tr>
                    <th>Current Value</th>
                    <td id="currentValue">₹5,000</td>
                </tr>
                <tr>
                    <th>Profit/Loss</th>
                    <td id="profit">₹+2,500</td>
                </tr>
                <tr>
                    <th>Profit %</th>
                    <td id="profitPct">+100%</td>
                </tr>
            </table>
            <div id="overall" class="overall">
                <strong>Overall Amount: <span id="overallAmt">₹7,500</span></strong>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const buyPrice = parseFloat(document.getElementById('buyPrice').value) || 0;
            const quantity = parseInt(document.getElementById('quantity').value) || 0;
            const currentPrice = parseFloat(document.getElementById('currentPrice').value) || 0;
            
            const invested = (buyPrice * quantity).toLocaleString('en-IN');
            const currentValue = (currentPrice * quantity).toLocaleString('en-IN');
            const profitAmt = (currentPrice - buyPrice) * quantity;
            const profit = profitAmt.toLocaleString('en-IN');
            const profitPercent = buyPrice > 0 ? ((currentPrice - buyPrice) / buyPrice * 100).toFixed(2) : '0.00';
            const overallAmount = (buyPrice * quantity) + (currentPrice * quantity);
            const overallFormatted = overallAmount.toLocaleString('en-IN');
            
            document.getElementById('invested').textContent = `₹${invested}`;
            document.getElementById('currentValue').textContent = `₹${currentValue}`;
            
            const profitEl = document.getElementById('profit');
            profitEl.innerHTML = `₹${profitAmt >= 0 ? '+' : ''}${profit}`;
            profitEl.className = profitAmt >= 0 ? 'profit' : 'loss';
            
            const pctEl = document.getElementById('profitPct');
            pctEl.innerHTML = `${profitAmt >= 0 ? '+' : ''}${profitPercent}%`;
            pctEl.className = profitAmt >= 0 ? 'profit' : 'loss';
            
            document.getElementById('overallAmt').textContent = `₹${overallFormatted}`;
        }
        
        ['buyPrice', 'quantity', 'currentPrice'].forEach(id => {
            document.getElementById(id).addEventListener('input', calculate);
        });
        calculate();
    </script>
</body>
</html>
